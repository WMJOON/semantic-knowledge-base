module:
  name: Search and Reason
  id: search-reason
  version: "1.0"
  description: Check the search index state, then run the OWL 2 RL consistency check.
  owner: user

explorer:
  id: explorer
  label: Search and reason
  status: pending
  steps:
    - type: step
      id: sr-s-01
      label: Check search index
      instruction: Check the semantic-search index state for evidence and concepts.
      status: pending
      directories:
        - {role: input, path: evidence/}
        - {role: input, path: ontology/}
        - {role: output, path: report/}
      deliverables:
        - report/

x_msm:
  category: explorer
  kind: pipeline
  mode: dry-run
  status: draft
  tool: skb-graph-reasoning
  inputs:
    query: null
  outputs:
    report: report/
  runtime:
    tier: L1
    timeout_seconds: 600
    max_concurrency: 1
  pipeline:
    - step_id: retrieve
      tool: skb-semantic-search
      action: status
    - step_id: check
      tool: skb-graph-reasoning
      action: check
  governance:
    hitl_required: false
    max_retry: 1
    oracle: ontology_readiness
    oracle_threshold: 0.85
