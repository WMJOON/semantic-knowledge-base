version: "1.1"
locked: true

domains: []

system:
  semantic: ontology/system/semantic/**/*.ttl
  kinetic: ontology/system/kinetic/**/*.ttl
  dynamic: ontology/system/dynamic/**/*.ttl

provenance:
  source_registry: evidence/seeds.jsonl
  asserted_graph: ontology/system/semantic/**/*.ttl
  shapes: ontology/system/semantic/**/*.shapes.ttl

scan:
  include: "ontology/system/semantic/**/*.ttl"
  exclude:
    - "ontology/system/semantic/**/*.shapes.ttl"
    - "ontology/system/semantic/**/*.inferred.ttl"
  orphan_exit_code: 1

sync:
  structural_ssot: ttl
  projection_target: md
  auto_apply_md_to_ttl: false
